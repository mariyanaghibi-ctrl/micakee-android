name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -o micakee_android_pro_v3_READY2.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          ROOT=$(dirname "$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Android project found at: $ROOT"

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> "$ROOT/gradle.properties"
          echo "android.enableJetifier=true" >> "$ROOT/gradle.properties"

      - name: Fix JVM target
        run: |
          sed -i 's/jvmTarget *= *"1.8"/jvmTarget = "17"/g' "$ROOT/app/build.gradle.kts"
          sed -i 's/sourceCompatibility *= *JavaVersion.VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' "$ROOT/app/build.gradle.kts"
          sed -i 's/targetCompatibility *= *JavaVersion.VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' "$ROOT/app/build.gradle.kts"

      - name: Build APK
        run: |
          gradle -p "$ROOT" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: micakee-apk
          path: 'project/**/build/outputs/apk/**/*.apk'
