name: Build MiCakee APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract new project
        run: |
          mkdir -p project
          unzip -o micakee_android_v13_buildable.zip -d project

      - name: Enable AndroidX
        

        run: mkdir -p project && touch project/gradle.properties && echo "android.useAndroidX=true" >> project/gradle.properties

      - name: Align Java and Kotlin targets
        run: |
          find project/app -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/VERSION_1_8/VERSION_17/g; s/"1.8"/"17"/g' {} \;

      - name: Build APK
        run: gradle -p project assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCakee-new-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


