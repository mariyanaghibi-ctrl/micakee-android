name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -o micakee_android_pro_v3_READY2.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          ROOT=$(dirname "$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Android project found at: $ROOT"

      - name: Build APK
        run: |
          gradle -p "$ROOT" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: micakee-apk
          path: 'project/**/build/outputs/apk/**/*.apk'
